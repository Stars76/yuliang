services:
  quota-dashboard:
    build: .
    ports:
      - "127.0.0.1:18318:18318"
    volumes:
      - ./data:/data
    environment:
      HOST: 0.0.0.0
      PORT: 18318
      DATA_DIR: /data
      # 容器内 127.0.0.1 不是宿主机；CPA 管理口走 docker 网关
      CPA_MGMT_URL: http://host.docker.internal:8317
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # 公开端点，无需凭证；initialized=false 时也返回 200
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18318/api/auth/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
