name: verify

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 引擎 + provider 测试
        run: npm test

      - name: 前端构建（Electron 壳 + Android WebView）
        run: |
          npm ci --prefix src/web
          npm run build:web
          npm ci --prefix src/standalone/capacitor
          npm run build:android-web
